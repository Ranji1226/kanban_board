[project]
name = "kanban-board-backend"
version = "0.1.0"
description = "Local FastAPI backend for Kanban Studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "httpx2>=0.1",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
